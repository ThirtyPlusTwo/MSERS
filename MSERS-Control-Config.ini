[WEATHER]
    WeatherCycleTime=200 # Time in s; e.g. 200s/(60s/1min) = 3min & 20s (ie, 3.33min)
    MaxWeatherChangeStates=1 # Bounded between 1 and 5, this determines how many states can be skipped per weather cycle
    WeatherStateWetness={0,0,0,10,60,100} # Clear, LightClouds, Cloudy, Overcast, Drizzle, Rain, HeavyRain
[CHECKPOINTS]
    CheckpointSensorsNamePrefix="Checkpoint Sensor " # "Checkpoint 1", "Checkpoint 2", and so on. "Checkpoint 1" is the Start/Finish line sensor
    TotalCheckpointCount=3 # The Start/Finish Line would be Checkpoint 1
[PIT-ZONE]
    PitEntrySensorName="Pit Entry Sensor"
    PitExitSensorName="Pit Exit Sensor"
    PitSpeed=20 # Speed (m/s) which cars are limited to while in the pits
    MinPitTime=1.5 # Minimum time in s to change tires for a pit stop (-3 standard deviations)
    MaxPitTime=4 # Maximum time in s to change tires for a pit stop (+3 standard deviations)
[DISPLAY]
    LapPositionLCDName="Race Position LCD" # Each of these are names for the individual display parts, no need for a group
    LapDetailsLCDName="Race Laps LCD"
    FastestLapsLCDName="Race Fastest Laps LCD"
    WeatherDetailsLCDName="Weather Details LCD"
    IndividualTimingLCDName="[TIMING]" # Aligning with the GPRS feature
[START-LIGHTS]
    StartLightsCount=3
    TimePerLight=1 # Time in s
    StartLightsDelayTime=10 # Time in s before lights begin to light
    StartLightsOutMin=0.5 # Minimum s delay before the lights turn off (-3 standard deviations)
    StartLightsOutMax=5.5 # Maximum s delay before the lights turn off (+3 standard deviations)
    StartLightsGroupNamePrefix="Start Lights "
    StartLightsGoGroupName="Start Lights Go"
[TRACK-MODE-1]
    TrackModeName="Practice"
    DoRaceLights=false
    MaxLaps=0 # Set to 0 to allow any maximum number of laps
    MaxTime=0 # Set to 0 to allow any maxumum amount of time
    WeatherEnabled=false # Will default to "Clear" in that case
    OvertakeModeEnabled=false
[TRACK-MODE-2]
    TrackModeName="Qualifying"
    DoRaceLights=true
    MaxLaps=0
    MaxTime=600 # Time in s, e.g. 600s/(60s/1min) = 10min
    WeatherEnabled=false # Will default to "Clear" in that case
    OvertakeModeEnabled=false
[TRACK-MODE-3]
    TrackModeName="Sprint"
    DoRaceLights=true
    MaxLaps=15
    MaxTime=0
    WeatherEnabled=true
    WeatherInitial="Clear" # Can be (case-insensitive): Clear, LightClouds, Cloudy, Overcast, Drizzle, Rain, HeavyRain
    WeatherChanceType=1 # 1 is for Lap, 2 is for Time (in s)
    WeatherChances={1,50,50} # (integer values) first value specifies when new chances happen, wetter chance, drier chance
    OvertakeModeEnabled=true
    OvertakeModeDelta=2 # Separation time in s between two drivers on the same lap to give the following driver a boost come the start/finish line
[TRACK-MODE-4]
    TrackModeName="Race"
    DoRaceLights=true
    MaxLaps=15
    MaxTime=0
    WeatherEnabled=true
    WeatherInitial="Clear" # Can be (case-insensitive): Clear, LightClouds, Cloudy, Overcast, Drizzle, Rain, HeavyRain
    WeatherChanceType=1 # 1 is for Lap, 2 is for Time (in s)
    WeatherChances={1,50,50} # (integer values) first value specifies when new chances happen, wetter chance, drier chance
    OvertakeModeEnabled=true
    OvertakeModeDelta=2 # Separation time in s between two drivers on the same lap to give the following driver a boost come the start/finish line
[CAR-CLASS-1]
    ClassNameTag="GTE"
    ValidTires={"Soft","Medium","Hard","Int","Wet"}
    BaseMaxSpeed=85 # m/s: reference speed for tire wear & fuel drain 
    BasePower=55 # % wheel power
    DoFrontSteering=true
    DoRearSteering=false
    MaxSteeringAngle=99 # max angle in deg
    MinWheelHeight=0.99 # minimum height in m
    MinWheelbase=8 # blocks
    MaxLateralSpeed=99 # maximum lateral speed before wheel friction is reduced to make car slip
    
    DraftingSpeedIncrease=5 # +m/s
    DraftingPowerIncrease=15 # +%
    ResidualDraftingTime=2 # s
    
    FuelSpeedIncrease=1 # +m/s
    FuelPowerIncrease=9 # +%
    FuelLifetime=1260 # time in s, reference speed is BaseMaxSpeed
    RefuelTime=20 # time in s to go from 0% to 100% fuel
    MaxFuelModifier=0
    
    ERSSpeedIncrease=0 # +m/s
    ERSPowerIncrease=0 # +%
    ERSWheelPropulsionOverride=0 # CRS uses 1.7 for reference
    ERSLifetime=0 # time in s to go from 100% to 0% charge
    ERSRechargeTime=0 # time in s to go from 0% to 100% charge
    ERSPitRechargeTime=0 # time in s to go from 0% to 100% charge while pit limiter is active
    MaxERSModifier=0
    
    DownforceFactor=0 # factor * mass * g = available thrust
    MinDownforceSpeed=0 # m/s
[TIRE-CLASS-1]
    TireName="Soft"
    StartFriction=100
    EndFriction=35
    Lifetime=480 # time in s
    MaxWetness=0
    WetnessEffect=0.2 # friction multiplier at 100% tire wetness
    WetnessTime=40 # time in s to go from 0% to 100% tire wetness
[TIRE-CLASS-2]
    TireName="Medium"
    StartFriction=80
    EndFriction=35
    Lifetime=780 # time in s
    MaxWetness=0
    WetnessEffect=0.2 # friction multiplier at 100% tire wetness
    WetnessTime=40 # time in s to go from 0% to 100% tire wetness
[TIRE-CLASS-3]
    TireName="Hard"
    StartFriction=60
    EndFriction=40
    Lifetime=1260 # time in s
    MaxWetness=0
    WetnessEffect=0.2 # friction multiplier at 100% tire wetness
    WetnessTime=40 # time in s to go from 0% to 100% tire wetness
[TIRE-CLASS-4]
    TireName="Int"
    StartFriction=60
    EndFriction=40
    Lifetime=480 # time in s
    MaxWetness=70
    WetnessEffect=0.8 # friction multiplier at 100% tire wetness
    WetnessTime=40 # time in s to go from 0% to 100% tire wetness
[TIRE-CLASS-5]
    TireName="Wet"
    StartFriction=50
    EndFriction=40
    Lifetime=1260 # time in s
    MaxWetness=100
    WetnessEffect=1 # friction multiplier at 100% tire wetness
    WetnessTime=40 # time in s to go from 0% to 100% tire wetness
