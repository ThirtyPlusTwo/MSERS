[WEATHER]
    WeatherCycleTime=200 # Time in seconds; e.g. 200s/(60s/1min) = 3min & 20s (ie, 3.33min)
    MaxWeatherChangeStates=1 # Bounded between 1 and 5, this determines how many states can be skipped per weather cycle
[CHECKPOINTS]
    CheckpointSensorsNamePrefix="Checkpoint Sensor " # "Checkpoint 1", "Checkpoint 2", and so on. "Checkpoint 1" is the Start/Finish line sensor
    TotalCheckpointCount=3 # The Start/Finish Line would be Checkpoint 1
[PIT-ZONE]
    PitEntrySensorName="Pit Entry Sensor"
    PitExitSensorName="Pit Exit Sensor"
    PitSpeed=20 # Speed (m/s) which cars are limited to while in the pits
    MinPitTime=1.5 # Minimum time in seconds to change tires for a pit stop (-3 standard deviations)
    MaxPitTime=4 # Maximum time in seconds to change tires for a pit stop (+3 standard deviations)
[DISPLAY]
    LapPositionLCDName="Race Position LCD" # Each of these are names for the individual display parts, no need for a group
    LapDetailsLCDName="Race Laps LCD"
    FastestLapsLCDName="Race Fastest Laps LCD"
    WeatherDetailsLCDName="Weather Details LCD"
    IndividualTimingLCDName="[TIMING]" # Aligning with the GPRS feature
[START-LIGHTS]
    StartLightsCount=3
    TimePerLight=1 # Time in seconds
    StartLightsDelayTime=10 # Time in seconds before lights begin to light
    StartLightsOutMin=0.5 # Minimum seconds delay before the lights turn off (-3 standard deviations)
    StartLightsOutMax=5.5 # Maximum seconds delay before the lights turn off (+3 standard deviations)
    StartLightsGroupNamePrefix="Start Lights "
    StartLightsGoGroupName="Start Lights Go"
[TRACK-MODE-1]
    TrackModeName="Practice"
    DoRaceLights=false
    MaxLaps=0 # Set to 0 to allow any maximum number of laps
    MaxTime=0 # Set to 0 to allow any maxumum amount of time
    WeatherEnabled=false # Will default to "Clear" in that case
    OvertakeModeEnabled=false
[TRACK-MODE-2]
    TrackModeName="Qualifying"
    DoRaceLights=true
    MaxLaps=0
    MaxTime=600 # Time in seconds, e.g. (10min * (60s/1min)) = 600s
    WeatherEnabled=false # Will default to "Clear" in that case
    OvertakeModeEnabled=false
[TRACK-MODE-3]
    TrackModeName="Sprint"
    DoRaceLights=true
    MaxLaps=15
    MaxTime=0
    WeatherEnabled=true
    WeatherInitial="Clear" # Can be (case-insensitive): Clear, LightClouds, Cloudy, Overcast, Drizzle, Rain, HeavyRain
    WeatherChanceType = 1 # 1 is for Lap, 2 is for Time (in s)
    WeatherChances={1, 50, 50} # (integer values) first value specifies when new chances happen, wetter chance, drier chance
    OvertakeModeEnabled=true
    OvertakeModeDelta=2 # Separation time in seconds between two drivers on the same lap to give the following driver a boost come the start/finish line
[TRACK-MODE-4]
    TrackModeName="Race"
    DoRaceLights=true
    MaxLaps=15
    MaxTime=0
    WeatherEnabled=true
    WeatherInitial="Clear" # Can be (case-insensitive): Clear, LightClouds, Cloudy, Overcast, Drizzle, Rain, HeavyRain
    WeatherChanceType=1 # 1 is for Lap, 2 is for Time (in s)
    WeatherChances={1, 50, 50} # (integer values) first value specifies when new chances happen, wetter chance, drier chance
    OvertakeModeEnabled=true
    OvertakeModeDelta=2 # Separation time in seconds between two drivers on the same lap to give the following driver a boost come the start/finish line
[CAR-CLASS-1]
    ClassNameTag="GTE"
    ValidTires="Soft","Medium"
[TIRE-CLASS-1]
    TireName="Soft"
    MinFriction=20
    MaxFriction=100
[TIRE-CLASS-2]
    TireName="Medium"
[TIRE-CLASS-3]
    TireName="Hard"
